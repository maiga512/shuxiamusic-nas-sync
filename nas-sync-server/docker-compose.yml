services:
  shuxia-nas-sync:
    build:
      context: ..
      dockerfile: nas-sync-server/Dockerfile
    container_name: shuxia-nas-sync
    restart: unless-stopped
    environment:
      SHUXIA_SYNC_HOST: 0.0.0.0
      SHUXIA_SYNC_PORT: 31231
      SHUXIA_SYNC_DB_PATH: /data/shuxia-sync.sqlite
      SHUXIA_SYNC_ADMIN_TOKEN: ${SHUXIA_SYNC_ADMIN_TOKEN:?set SHUXIA_SYNC_ADMIN_TOKEN in .env}
    ports:
      - "31231:31231"
    volumes:
      - ./data:/data
